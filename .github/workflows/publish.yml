name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, build and publish current versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package versions
        run: bun scripts/set-version.ts "${{ github.event.inputs.version }}"

      - name: Build packages and embed dashboard
        run: bun run build:release

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test packages

      - name: End-to-end smoke
        run: bun run e2e

      - name: Verify CLI package contains the dashboard
        run: npm pack ./packages/cli --dry-run

      - name: Publish packages
        run: bun run scripts/publish.ts
